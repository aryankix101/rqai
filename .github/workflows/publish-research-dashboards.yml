# Publish the curated, self-contained research dashboard bundle to GitHub Pages.
# Generated backtests and private caches remain excluded from the deployment.

name: Publish research dashboards

on:
  push:
    branches: [main]
    paths:
      - "docs/research/**"
      - ".github/workflows/publish-research-dashboards.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard site
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/research

      - name: Deploy dashboard site
        id: deployment
        uses: actions/deploy-pages@v4
